  .cmAddr { flex:1; font-family:Consolas, monospace; font-size:11.5px; background:var(--inputBg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; word-break:break-all; min-width:200px; }
  .cmBtn { background:var(--inputBg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:12px; font-weight:600; text-decoration:none; cursor:pointer; }

  details { margin-top:12px; font-size:13px; color:var(--dim); }

  #compatPop .ok { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:var(--acc); color:var(--btnText); border:none; border-radius:6px; padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .foot { max-width:1180px; margin:8px auto 0; padding:22px 24px 30px; border-top:1px solid var(--line); }
  .footIn { max-width:720px; margin:0 auto; text-align:center; color:var(--dim); font-size:12.5px; line-height:1.6; }
  .footData { margin:0 0 10px; }
  .footLove { margin:0 0 8px; font-size:13px; color:var(--fg); }
  .footDisc { margin:0; font-size:11.5px; opacity:.75; }
  .footLove a { color:var(--acc); font-weight:600; text-decoration:none; }
  .footLove a:hover { text-decoration:underline; }
  .footLove .hh { color:#d05353; }
  .ideatop { max-width:720px; margin:12px auto 0; text-align:center; color:var(--dim); font-size:13.5px; line-height:1.55; }
  .ideatop p { margin:0 0 3px; }

function t(key){
  return (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
}
function tf(key, map){
  return t(key).replace(/\{(\w+)\}/g, (_, k) => map[k]);
}

// ---------- даты ----------
const fmtTemp = t => (t > 0 ? "+" : "") + Math.round(t) + "°";
const hhmm = iso => iso.slice(11, 16);
const two = x => String(x).padStart(2, "0");
function dateLong(d){ return new Intl.DateTimeFormat(LOCALE[LANG], { weekday: "long", day: "numeric", month: "long" }).format(d); }
function dayShort(d){ return new Intl.DateTimeFormat(LOCALE[LANG], { weekday: "short" }).format(d) + " " + d.getDate(); }

// ---------- фаза луны ----------
const SYNODIC = 29.530588853;
function moonPhase(date){
  const ref = Date.UTC(2000, 0, 6, 18, 14);
  const daysMs = (date.getTime() - ref) / 86400000;
  let p = (daysMs % SYNODIC) / SYNODIC;
  if (p < 0) p += 1;
  const illum = Math.round((1 - Math.cos(2 * Math.PI * p)) / 2 * 100);
  let idx;
  if (p < .03 || p > .97) idx = 0;
  else if (p < .22) idx = 1;
  else if (p < .28) idx = 2;
  else if (p < .47) idx = 3;
  else if (p < .53) idx = 4;
  else if (p < .72) idx = 5;
  else if (p < .78) idx = 6;
  else idx = 7;
  return { phase: p, illum, name: I18N[LANG].moon[idx] };
}

// ---------- погода: коды WMO ----------
function wmoKey(code){
  if (code === 0) return 0;
  if (code === 1) return 1;
  if (code === 2) return 2;
  if (code === 3) return 3;
  if (code <= 48) return 45;
  if (code <= 57) return 56;
  if (code === 61) return 61;
  if (code === 63) return 63;
  if (code === 65) return 65;
  if (code <= 67) return 66;
  if (code <= 72) return 71;
  if (code <= 74) return 73;
  if (code <= 76) return 75;
  if (code === 77) return 77;
  if (code <= 82) return 80;
  if (code <= 86) return 85;
  if (code === 95) return 95;
  return 96;
}
function wmoText(code){
  const d = I18N[LANG].wmo;
  const k = wmoKey(code);
  return d[k] !== undefined ? d[k] : d[80];
}
function wmoKind(code){
  if (code === 0) return "sun";
  if (code <= 2) return "partly";
  if (code === 3) return "cloud";
  if (code <= 48) return "fog";
  if (code <= 57) return "drizzle";
  if (code <= 67) return "rain";
  if (code <= 77) return "snow";
  if (code <= 82) return "rain";
  if (code <= 86) return "snow";
  return "thunder";
}

// ---------- рисование ----------
let BG = "#ffffff", FG = "#000000";

function setFont(px, bold){ ctx.font = (bold ? "700 " : "400 ") + Math.round(px) + "px 'Segoe UI', Arial, sans-serif"; }
function text(str, x, y, px, bold, align){
  setFont(px, bold);
  ctx.textAlign = align || "left";
  ctx.fillStyle = FG;
  ctx.fillText(str, x, y);
}

function drawSun(cx, cy, r){
  ctx.strokeStyle = FG;
  ctx.lineWidth = Math.max(2, r * 0.11);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 8; i++){
    const a = Math.PI / 8 + i * Math.PI / 4;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r * 1.3, cy + Math.sin(a) * r * 1.3);
    ctx.lineTo(cx + Math.cos(a) * r * 1.62, cy + Math.sin(a) * r * 1.62);
    ctx.stroke();
  }
  ctx.fillStyle = FG;
}
function drawCloud(cx, cy, s){
  ctx.beginPath();
  ctx.arc(cx - 0.42 * s, cy + 0.12 * s, 0.27 * s, Math.PI * 0.45, Math.PI * 1.55);
  ctx.arc(cx - 0.02 * s, cy - 0.18 * s, 0.30 * s, Math.PI * 0.9, Math.PI * 1.95);
  ctx.arc(cx + 0.36 * s, cy + 0.02 * s, 0.24 * s, Math.PI * 1.25, Math.PI * 0.55);
  ctx.closePath();
  ctx.fillStyle = BG; ctx.fill();
  ctx.strokeStyle = FG; ctx.stroke();
  ctx.fillStyle = FG;
}
function drawIcon(kind, cx, cy, s){
  ctx.strokeStyle = FG; ctx.fillStyle = FG;
  ctx.lineWidth = Math.max(2, s * 0.055);
  const so = s * 0.34;
  if (kind === "sun") drawSun(cx, cy, s * 0.36);
  else if (kind === "moon") drawMoon(cx, cy, s * 0.36, moonPhase(new Date()).phase);
  else if (kind === "partly"){ drawSun(cx - s * 0.18, cy - s * 0.28, s * 0.24); drawCloud(cx + s * 0.08, cy + s * 0.14, s * 0.68); }
  else if (kind === "cloud") drawCloud(cx, cy, s * 0.8);
  else if (kind === "fog"){
    drawCloud(cx, cy - s * 0.14, s * 0.62);
    for (let i = 0; i < 3; i++){ ctx.beginPath(); ctx.moveTo(cx - s * 0.34, cy + s * 0.1 + i * s * 0.14); ctx.lineTo(cx + s * 0.34, cy + s * 0.1 + i * s * 0.14); ctx.stroke(); }
  }
  else if (kind === "drizzle" || kind === "rain"){
    drawCloud(cx, cy - s * 0.16, s * 0.66);
    const n = kind === "rain" ? 3 : 2, len = s * (kind === "rain" ? 0.2 : 0.12);
    for (let i = 0; i < n; i++){
      const x = cx + (i - (n - 1) / 2) * s * 0.22;
      ctx.beginPath(); ctx.moveTo(x, cy + s * 0.1); ctx.lineTo(x - s * 0.07, cy + s * 0.1 + len); ctx.stroke();
    }
  }
  else if (kind === "snow"){
    drawCloud(cx, cy - s * 0.16, s * 0.66);
    for (let i = 0; i < 3; i++){
      const x = cx + (i - 1) * s * 0.22, y = cy + s * 0.16, rr = s * 0.055;
      for (let a = 0; a < 3; a++){
        const an = a * Math.PI / 3;
        ctx.beginPath(); ctx.moveTo(x - Math.cos(an) * rr, y - Math.sin(an) * rr); ctx.lineTo(x + Math.cos(an) * rr, y + Math.sin(an) * rr); ctx.stroke();
      }
    }
  }
  else if (kind === "thunder"){
    drawCloud(cx, cy - s * 0.18, s * 0.62);
    ctx.beginPath();
    ctx.moveTo(cx + s * 0.05, cy + s * 0.04);
    ctx.lineTo(cx - s * 0.08, cy + s * 0.22);
    ctx.lineTo(cx + s * 0.01, cy + s * 0.22);
    ctx.lineTo(cx - s * 0.06, cy + s * 0.42);
    ctx.lineTo(cx + s * 0.12, cy + s * 0.16);
    ctx.lineTo(cx + s * 0.02, cy + s * 0.16);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = FG; ctx.strokeStyle = FG;
}

function drawMoon(cx, cy, r, phase){
  const k = Math.cos(2 * Math.PI * phase);
  const waxing = phase <= 0.5;
  const s = waxing ? 1 : -1;
  const a = Math.abs(k) * r;
  const insideTerm = (dx, dy) => a > 0 && (dx * dx) / (a * a) + (dy * dy) / (r * r) <= 1;
  ctx.fillStyle = FG;
  for (let dy = -r; dy <= r; dy++){
    for (let dx = -r; dx <= r; dx++){
      if (dx * dx + dy * dy > r * r) continue;
      let dark;
      if (Math.abs(k) < 0.02) dark = false;
      else if (Math.abs(k) > 0.98) dark = true;
      else if (k > 0) dark = (s * dx <= 0) || insideTerm(dx, dy);
      else dark = (s * dx < 0) && !insideTerm(dx, dy);
      if (dark) ctx.fillRect(cx + dx, cy + dy, 1, 1);
    }
  }
  ctx.strokeStyle = FG;
  ctx.lineWidth = Math.max(2, r * 0.07);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = FG;
}

// ---------- карточка ----------
function drawCard(dayOffset){
  dayOffset = dayOffset || 0;
  const w = canvas.width, h = canvas.height;
  const inv = theme === "dark";
  BG = inv ? "#000000" : "#ffffff";
  FG = inv ? "#ffffff" : "#000000";
  ctx.fillStyle = BG; ctx.fillRect(0, 0, w, h);
  ctx.textBaseline = "alphabetic";

  const pad = Math.round(w * 0.058);
  const now = new Date();
  const cardDate = new Date(now.getTime() + dayOffset * 86400000);
  const moon = moonPhase(cardDate);
  const d0 = weather ? weather.daily : null;
  const cur = weather ? weather.current : null;

  let y;
  if (W.date){
    text(dateLong(cardDate), w / 2, pad + w * 0.062, w * 0.062, true, "center");
    y = pad + w * 0.062 + Math.max(h * 0.033, w * 0.095);
  } else {
    y = pad + Math.max(h * 0.033, w * 0.06);
  }

  if (weather){
    let drew = false;
    const footH = h * 0.062;

    if (W.cur){
      drew = true;
      const iconS = w * 0.32;
      let tempSize = w * 0.28;
      const tempStr = fmtTemp(cur.temperature_2m);
      const maxTempW = w - pad * 2 - iconS - w * 0.06;
      setFont(tempSize, true);
      while (tempSize > w * 0.12 && ctx.measureText(tempStr).width > maxTempW){
        tempSize -= 2;
        setFont(tempSize, true);
      }
      ctx.textAlign = "left";
      ctx.fillStyle = FG;
      ctx.fillText(tempStr, pad, y + tempSize * 0.8);
      drawIcon(wmoKind(cur.weather_code), w - pad - iconS / 2, y + iconS * 0.48, iconS);
      y += Math.max(tempSize * 0.8, iconS * 0.96) + w * 0.085;

      text(wmoText(cur.weather_code), pad, y, w * 0.072, true);
      y += w * 0.072 + h * 0.014;
    }
    if (W.dn){
      text(t("dayLbl") + " " + fmtTemp(d0.temperature_2m_max[dayOffset]) + "   ·   " + t("nightLbl") + " " + fmtTemp(d0.temperature_2m_min[dayOffset]), pad, y, w * 0.056, false);
      y += h * 0.045;
      drew = true;
    }
    if (W.sm){
      const labelPx = w * 0.048, timePx = w * 0.06;
      const col2 = w * 0.55;
      drawIcon("sun", pad + w * 0.032, y - timePx * 0.28, w * 0.064);
      text(t("sunrise") + " ", pad + w * 0.075, y, labelPx, false);
      const w1 = ctx.measureText(t("sunrise") + " ").width;
      text(hhmm(d0.sunrise[dayOffset]), pad + w * 0.075 + w1, y, timePx, true);
      drawIcon("moon", col2 + w * 0.032, y - timePx * 0.28, w * 0.064);
      text(t("sunset") + " ", col2 + w * 0.075, y, labelPx, false);
      const w2 = ctx.measureText(t("sunset") + " ").width;
      text(hhmm(d0.sunset[dayOffset]), col2 + w * 0.075 + w2, y, timePx, true);
      y += h * 0.042;
      drew = true;
    }
    {
      text(moon.name + "  ·  " + moon.illum + "%", pad, y, w * 0.048, false);
      y += h * 0.042;
      drew = true;
    }
    if (W.fc){
      if (drew){
        ctx.strokeStyle = FG;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - pad, y); ctx.stroke();
        y += h * 0.026;
      }
      const n = Math.min(days, weather.daily.time.length - 1 - dayOffset);
      const rowH = Math.max(34, Math.min(w * 0.14, (h - footH - y) / Math.max(1, n)));
      const txtPx = Math.min(w * 0.054, rowH * 0.52);
      for (let i = dayOffset + 1; i <= dayOffset + n; i++){
        const d = new Date(weather.daily.time[i] + "T12:00:00");
        const cy2 = y + rowH / 2;
        text(dayShort(d), pad, cy2 + txtPx * 0.36, txtPx, true);
        drawIcon(wmoKind(weather.daily.weather_code[i]), w * 0.40, cy2, rowH * 0.62);
        text(t("dS") + " " + fmtTemp(weather.daily.temperature_2m_max[i]) + " · " + t("nS") + " " + fmtTemp(weather.daily.temperature_2m_min[i]), w - pad, cy2 + txtPx * 0.36, txtPx, false, "right");
        y += rowH;
      }
      drew = true;
    }
    if (W.city){
      const fpx = w * 0.04;
      text(place ? place.name : "", pad, h - footH * 0.3, fpx, false);
      text(t("updated") + " " + two(now.getHours()) + ":" + two(now.getMinutes()), w - pad, h - footH * 0.3, fpx, false, "right");
    }
  } else {
    text(t("noData"), w / 2, y + h * 0.1, w * 0.07, false, "center");
  }
}

// ---------- BMP ----------
function encodeBMP(){
  const w = canvas.width, h = canvas.height;
  const img = ctx.getImageData(0, 0, w, h).data;
  const rowSize = Math.floor((24 * w + 31) / 32) * 4;
  const dataSize = rowSize * h, fileSize = 54 + dataSize;
  const buf = new ArrayBuffer(fileSize), dv = new DataView(buf);
  dv.setUint8(0, 0x42); dv.setUint8(1, 0x4D);
  dv.setUint32(2, fileSize, true);
  dv.setUint32(10, 54, true);
  dv.setUint32(14, 40, true);
  dv.setInt32(18, w, true);
  dv.setInt32(22, h, true);
  dv.setUint16(26, 1, true);
  dv.setUint16(28, 24, true);
  dv.setUint32(34, dataSize, true);
  for (let y = 0; y < h; y++){
    let off = 54 + (h - 1 - y) * rowSize;
    for (let x = 0; x < w; x++){
      const i = (y * w + x) * 4;
      const lum = 0.299 * img[i] + 0.587 * img[i + 1] + 0.114 * img[i + 2];
      const v = lum < 140 ? 0 : 255;
      dv.setUint8(off, v); dv.setUint8(off + 1, v); dv.setUint8(off + 2, v);
      off += 3;
    }
  }
  return new Blob([buf], { type: "image/bmp" });
}

// ---------- сеть ----------
function setStatus(msg, cls){ const s = $("status"); s.textContent = msg; s.className = cls || ""; }

async function searchCity(){
  const q = $("city").value.trim();
  if (!q) return;
  $("geoResults").innerHTML = "";
  setStatus(t("stSearching"));
  let list = null;
  // 1) Open-Meteo geocoder
  try {
    for (const lg of [LANG, "", "en"]){
      const u = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(q) + "&count=8&format=json" + (lg ? "&language=" + lg : "");
      const r = await fetch(u);
      const j = await r.json();
      if (j.results && j.results.length){
        list = j.results.map(res => ({ name: res.name, sub: [res.admin1, res.country].filter(Boolean).join(", "), lat: res.latitude, lon: res.longitude }));
        break;
      }
    }
  } catch(e){ /* переходим к Nominatim */ }
  // 2) фолбэк: Nominatim (OpenStreetMap), если Open-Meteo недоступен
  if (!list){
    try {
      const u = "https://nominatim.openstreetmap.org/search?q=" + encodeURIComponent(q) + "&format=jsonv2&addressdetails=1&limit=8&accept-language=" + (LOCALE[LANG] || "en");
      const r = await fetch(u);
      const j = await r.json();
      if (Array.isArray(j) && j.length){
        list = j.map(res => {
          const parts = String(res.display_name || "").split(", ");
          return { name: res.name || parts[0], sub: parts.slice(1).join(", "), lat: parseFloat(res.lat), lon: parseFloat(res.lon) };
        });
      }
    } catch(e){}
  }
  if (!list || !list.length){ setStatus(t("stNotFound"), "err"); return; }
  setStatus(tf("stFound", { n: list.length }));
  for (const res of list){
    const div = document.createElement("div");
    div.className = "geoItem";
    const b = document.createElement("b"); b.textContent = res.name;
    const sm = document.createElement("small"); sm.textContent = res.sub;
    div.appendChild(b); div.appendChild(sm);
    div.onclick = () => {
      $("geoResults").innerHTML = "";
      place = { name: res.name, lat: res.lat, lon: res.lon };
      storeSet("city", place);
      loadWeather();
    };
    $("geoResults").appendChild(div);
  }
}

async function loadWeather(){
  window._lw = (window._lw || 0) + 1;
  if (!place) return;
  setStatus(tf("stLoading", { city: place.name }));
  const n = 1 + days;
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + place.lat + "&longitude=" + place.lon +
    "&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset" +
    "&timezone=auto&forecast_days=" + Math.max(n, 6);
  for (let attempt = 0; attempt < 2; attempt++){
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status);
      weather = await r.json();
      drawCard();
    $("download").disabled = false;
    $("install").disabled = location.protocol === "https:";
      setStatus(tf("stReady", { w: canvas.width, h: canvas.height }), "ok");
      return;
    } catch(e){
      if (attempt === 0){ await new Promise(res => setTimeout(res, 1500)); setStatus("…повтор"); }
    }
  }
  setStatus(t("stWeatherFail") + " [" + (window._lwErr || 0) + "]", "err");
}

// ---------- интерфейс ----------
function currentSize(){ return DEVICES[device]; }
function applyDevice(){
  for (const b of $("deviceSeg").children) b.classList.toggle("active", b.dataset.dev === device);
  const size = currentSize();
  canvas.width = size[0]; canvas.height = size[1];
  if (weather) drawCard();
  else { ctx.fillStyle = BG; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  storeStr("device", device);
}
function applyDaysActive(){
  for (const b of $("daysSeg").children) b.classList.toggle("active", parseInt(b.dataset.days, 10) === days);
}
function applyLangActive(){
  for (const b of document.querySelectorAll(".badge.lang")) b.classList.toggle("active", b.dataset.lang === LANG);
}
function applyI18n(){
  document.documentElement.lang = LOCALE[LANG].split("-")[0];
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  const ph = document.querySelector("[data-i18n-ph]");
  if (ph) ph.placeholder = t("cityPh");
  $("donateWrap").style.display = (DONATE_URL || CRYPTO.length) ? "" : "none";
  applyLangActive();
}
async function refreshPlaceName(){
  if (!place) return;
  try {
    // Nominatim (OpenStreetMap): отдаёт название города на нужном языке по координатам
    const r = await fetch("https://nominatim.openstreetmap.org/reverse?lat=" + place.lat + "&lon=" + place.lon + "&format=jsonv2&zoom=10&accept-language=" + LOCALE[LANG]);
    const j = await r.json();
    const a = j.address || {};
    const name = a.city || a.town || a.village || a.municipality || a.county;
    if (name){
      place.name = name;
      storeSet("city", place);
      $("city").value = place.name;
    }
  } catch(e){ /* оставляем прежнее имя */ }
}
document.querySelectorAll(".badge.lang").forEach(b => b.onclick = async () => {
  if (LANG === b.dataset.lang) return;
  LANG = b.dataset.lang;
  storeStr("lang", LANG);
  await refreshPlaceName();
  applyI18n();
  if (weather) drawCard();
});
$("deviceSeg").onclick = e => {
  const b = e.target.closest("button[data-dev]");
  if (!b) return;
  device = b.dataset.dev;
  applyDevice();
  if (place) loadWeather();
};
$("daysSeg").onclick = e => {
  const b = e.target.closest("button[data-days]");
  if (!b) return;
  days = parseInt(b.dataset.days, 10);
  applyDaysActive();
  storeStr("days", String(days));
  if (place) loadWeather();
};
$("themeSeg").onclick = e => {
  const b = e.target.closest("button[data-theme]");
  if (!b) return;
  theme = theme === "dark" ? "light" : "dark";
  applyThemeActive();
  storeStr("invert", theme === "dark" ? "1" : "");
  if (weather) drawCard();
};
function applyThemeActive(){
  $("themeSeg").querySelector("button[data-theme=dark]").classList.toggle("active", theme === "dark");
}
$("searchCity").onclick = searchCity;
$("city").addEventListener("keydown", e => { if (e.key === "Enter") searchCity(); });
$("refresh").onclick = () => place ? loadWeather() : searchCity();
$("download").onclick = () => {
  drawCard();
  const blob = encodeBMP();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sleep.bmp";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

// ---------- установка на ридер ----------
function readerAddress(){
  const a = $("readerAddr").value.trim().replace(/\/+$/, "");
  if (!a) return "";
  storeStr("reader", a);
  return /^https?:\/\//.test(a) ? a : "http://" + a;
}

// ---------- релей (локальный сервер) ----------
let RELAY = false;
fetch("/relay-check").then(r => { RELAY = r.ok; }).catch(() => {});
function relaySend(blob, addr, folder, filename, onPct){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    const url = "/relay?addr=" + encodeURIComponent(addr + "/upload?path=" + encodeURIComponent(folder)) + "&name=" + encodeURIComponent(filename);
    xhr.open("POST", url);
    if (xhr.upload) xhr.upload.onprogress = e => { if (e.lengthComputable && onPct) onPct(e.loaded / e.total); };
    xhr.onload = () => resolve();
    xhr.onerror = () => reject(new Error("relay"));
    xhr.send(blob);
  });
}
// слепая отправка напрямую (когда релея нет)
function directSend(blob, addr, folder, filename){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", addr + "/upload?path=" + encodeURIComponent(folder));
    xhr.onload = () => resolve();
    xhr.onerror = () => resolve(); // ответ скрыт CORS, но запрос уходит
    const fd = new FormData();
    fd.append("file", new File([blob], filename, { type: "image/bmp" }));
    xhr.send(fd);
  });
}
async function sendOne(addr, folder, filename, blob, onPct){
  if (RELAY) return relaySend(blob, addr, folder, filename, onPct);
  return directSend(blob, addr, folder, filename);
}

async function installOnReader(){
  if (!weather){ setStatus(t("stNoWeather"), "err"); return; }
  const addr = readerAddress();
  if (!addr){ setStatus(t("stNoAddr"), "err"); return; }
  let folder = "/Sleep";
  setStatus(tf("stLoading", { city: addr }));
  drawCard();
  const blob = encodeBMP();
  try {
    await sendOne(addr, folder, "sleep.bmp", blob, p => {});
  } catch(e){
    setStatus(t("stSendErr"), "err");
    return;
  }
  setStatus(t("stApplying"));
  try { await fetch(addr + "/api/settings", { mode: "no-cors", method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ sleepScreen: 3 }) }); } catch(e){}
  setStatus(t("stDone"), "ok");
}

$("install").onclick = installOnReader;

const CRYPTO = [
  { coin: "USDT", net: "TRC20 / TRON", addr: "TXkyArvXBQyFqSMcfK7pFeeaCyaYgenUg1", qr: "https://qr.crypt.bot/?url=TXkyArvXBQyFqSMcfK7pFeeaCyaYgenUg1" },
  { coin: "BTC", net: "Bitcoin", addr: "bc1qyp7rcyasjk6k0eh84qc8wvveaptyqnkmmt33p6", qr: "https://qr.crypt.bot/?url=bc1qyp7rcyasjk6k0eh84qc8wvveaptyqnkmmt33p6" },
  { coin: "ETH", net: "Ethereum", addr: "0x68ba5c4b009579525fac3318AcD4Ec00938C5Ca4", qr: "https://qr.crypt.bot/?url=0x68ba5c4b009579525fac3318AcD4Ec00938C5Ca4" }
];
const COPY_ICON = String.fromCodePoint(0x1F4CC);
const COPIED_ICON = "✓".normalize();
function buildCryptoRows(){
  const rows = $("cmRows"); rows.innerHTML = "";
  for (const c of CRYPTO){
    const row = document.createElement("div"); row.className = "cmRow";
    const coin = document.createElement("div"); coin.className = "cmCoin";
    coin.innerHTML = c.coin + "<small>" + c.net + "</small>";
    const addr = document.createElement("div"); addr.className = "cmAddr"; addr.textContent = c.addr;
    const copy = document.createElement("button"); copy.className = "cmBtn"; copy.textContent = COPY_ICON;
    copy.onclick = () => {
      const done = () => { copy.textContent = COPIED_ICON + " " + t("copied"); setTimeout(() => { copy.textContent = COPY_ICON; }, 1600); };
      const fallback = () => { prompt(t("copied"), c.addr); done(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c.addr).then(done, fallback);
      else fallback();
    };
    const qr = document.createElement("a"); qr.className = "cmBtn"; qr.href = c.qr; qr.target = "_blank"; qr.rel = "noopener"; qr.textContent = "QR ↗";
    row.append(coin, addr, copy, qr);
    rows.appendChild(row);
  }
}
$("donateBtn").onclick = e => {
  e.stopPropagation();
  $("donateWrap").classList.toggle("open");
};
$("ddCrypto").onclick = () => {
  $("donateWrap").classList.remove("open");
  buildCryptoRows();
  $("cryptoModal").classList.add("open");
};
document.addEventListener("click", e => {
  if (!e.target.closest("#donateWrap")) $("donateWrap").classList.remove("open");
});
$("cmClose").onclick = () => $("cryptoModal").classList.remove("open");
$("cryptoModal").onclick = e => { if (e.target.id === "cryptoModal") $("cryptoModal").classList.remove("open"); };

// ---------- старт ----------
(function init(){
  const urlLang = new URLSearchParams(location.search).get("lang");
  const savedLang = storeRaw("lang");
  const navLang = (navigator.language || "en").toLowerCase().split("-")[0];
  LANG = (urlLang && I18N[urlLang]) ? urlLang : (savedLang && I18N[savedLang] ? savedLang : (navLang === "ru" ? "ru" : "en"));
  const savedCity = storeGet("city");
  if (savedCity){ place = savedCity; $("city").value = savedCity.name; }
  else if (LANG === "ru"){ place = { name: "Санкт-Петербург", lat: 59.9391, lon: 30.3159 }; $("city").value = "Санкт-Петербург"; }
  const d = storeRaw("device");
  device = DEVICES[d] ? d : "x4";
  const savedReader = (storeRaw("reader") || "").replace(/^https?:\/\//, "");
  if (savedReader) $("readerAddr").value = savedReader;
  const legacyDays = parseInt(storeRaw("days"), 10);
  if (legacyDays >= 2 && legacyDays <= 5) days = legacyDays;
  theme = storeRaw("invert") ? "dark" : "light";
  applyThemeActive();
  if (location.protocol === "https:") $("httpsNote").style.display = "block";
  applyI18n();
  applyDevice();
  applyDaysActive();
  if (place) loadWeather();
  if (!localStorage.getItem("lsx.compatSeen")){
    const cp = document.getElementById("compatPop");
    cp.style.display = "block";
    requestAnimationFrame(() => requestAnimationFrame(() => cp.classList.add("show")));
    document.getElementById("compatOk").onclick = () => {
      cp.classList.remove("show");
      localStorage.setItem("lsx.compatSeen", "1");
      setTimeout(() => { cp.style.display = "none"; }, 450);
    };
  }
})();
