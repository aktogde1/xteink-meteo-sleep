<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f2227" media="(prefers-color-scheme: dark)">
<title>Xteink Meteo Sleep</title>
<style>
  :root {
    --bg:#f5f3ef; --panel:#ffffff; --line:#e3dfd7; --fg:#22211e; --dim:#8a857c; --acc:#2f6f3e;
    --btnText:#ffffff; --inputBg:#fbfaf8; --codeBg:#f0ede6; --warnBg:#fdf3d8; --warnBorder:#ecd9a0; --warnText:#7a5200;
    --badgeBg:#181b20; --acc2:#7cc98b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#1f2227; --panel:#262b32; --line:#363c45; --fg:#e6e8ec; --dim:#9aa2ad; --acc:#7cc98b;
      --btnText:#12210f; --inputBg:#2b3037; --codeBg:#31373f; --warnBg:#3b3320; --warnBorder:#57503a; --warnText:#e8d491;
      --badgeBg:#0d0f12;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 "Segoe UI", Arial, sans-serif; }
  .nav { position:sticky; top:0; z-index:20; background:#181b20; padding:14px 20px 12px; }
  .navIn { max-width:1080px; margin:0 auto; text-align:center; }
  .brand { display:inline-block; color:#fff; text-decoration:none; font-size:22px; font-weight:800; letter-spacing:.5px; }
  .brand span { color:var(--acc2); }
  .navBadges { margin-top:10px; display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap; }
  .navBadges .badge { background:#0d0f12; border:1px solid #2a2f36; }
  .navBadges .badge.lang.active { background:var(--acc); color:#12210f; border-color:var(--acc); }
  .navBadges .badge .cnt { color:#f0c14b; letter-spacing:0; }
  .badge { display:inline-flex; align-items:center; gap:5px; background:var(--badgeBg); color:#fff; border:none; border-radius:4px; padding:7px 11px; font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; text-decoration:none; cursor:pointer; font-family:inherit; line-height:1; }
  .badge:hover { filter:brightness(1.3); }
  .badge.lang.active { background:var(--acc); color:var(--btnText); }
  .dd { position:relative; display:inline-flex; flex-direction:column; background:var(--badgeBg); border:2px solid #4a3f22; border-radius:10px; overflow:hidden; vertical-align:top; }
  .accHead { display:flex; align-items:center; gap:5px; background:none; border:none; color:#f0c14b; font-family:inherit; font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; padding:8px 11px; cursor:pointer; line-height:1; transition:font-size .15s, padding .15s; }
  .dd.open .accHead { font-size:10px; padding:6px 9px; }
  .hh { font-size:1.15em; }
  .accBody { max-height:0; overflow:hidden; transition:max-height .25s ease; }
  .dd.open .accBody { max-height:120px; }
  .accItem { display:flex; gap:8px; width:100%; text-align:left; padding:8px 10px; background:none; border:none; border-top:1px solid #2a2f36; cursor:pointer; color:#fff; font-size:12.5px; font-weight:600; font-family:inherit; text-decoration:none; }
  .accItem:hover { background:#22262d; }
  .accItem small { color:var(--dim); display:block; font-size:11px; font-weight:400; }
  .badge.donate { color:#f0c14b; border:2px solid #4a3f22; }
  main { display:flex; gap:26px; padding:24px; align-items:flex-start; flex-wrap:wrap; max-width:1180px; margin:0 auto; }
  #controls { width:340px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .group { margin-bottom:20px; }
  .group > label { display:block; font-size:12px; color:var(--dim); margin-bottom:7px; text-transform:uppercase; letter-spacing:.5px; font-weight:600; }
  input[type=text] { width:100%; background:var(--inputBg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:14.5px; }
  input[type=text]:focus { outline:2px solid var(--acc); outline-offset:-1px; }
  .inline { display:flex; gap:8px; }
  .inline input { flex:1; }
  button { cursor:pointer; font-family:inherit; }
  .btn { background:var(--acc); color:var(--btnText); border:none; border-radius:8px; padding:10px 16px; font-size:14.5px; font-weight:600; }
  .btn.secondary { background:var(--inputBg); color:var(--fg); border:1px solid var(--line); }
  .btn:disabled { opacity:.4; cursor:default; }
  .btn.wide { width:100%; margin-bottom:9px; }
  .seg { display:flex; gap:7px; }
  #themeSeg { margin-bottom:9px; }
  .seg button { flex:1; background:var(--inputBg); border:1px solid var(--line); border-radius:8px; padding:10px 4px; font-size:13.5px; font-weight:600; color:var(--fg); white-space:nowrap; }
  .seg button.active { background:var(--fg); color:var(--panel); border-color:var(--fg); }
  .seg.small button { padding:8px 4px; }
  .hint { font-size:12px; color:var(--dim); display:block; margin-top:7px; margin-bottom:10px; line-height:1.5; }
  .warn { color:var(--warnText); background:var(--warnBg); border:1px solid var(--warnBorder); border-radius:8px; padding:9px 11px; }
  .warn a { color:var(--acc); font-weight:600; }
  #geoResults { border:1px solid var(--line); border-radius:8px; margin-top:7px; overflow:hidden; }
  #geoResults:empty { display:none; }
  .geoItem { padding:9px 11px; cursor:pointer; font-size:14px; border-bottom:1px solid var(--line); background:var(--panel); }
  .geoItem:hover { background:var(--inputBg); }
  .geoItem small { color:var(--dim); display:block; font-size:12px; }
  #preview { flex:1; min-width:330px; display:flex; justify-content:center; }
  #frame { background:var(--panel); padding:12px; border-radius:16px; border:1px solid var(--line); box-shadow:0 2px 14px rgba(0,0,0,.08); }
  canvas { display:block; image-rendering:pixelated; height:82vh; max-height:840px; border:1px solid var(--line); }
  .status { font-size:13.5px; color:var(--dim); margin-top:2px; }
  .status:empty { display:none; }
  .status.ok { color:var(--acc); font-weight:600; }
  .status.err { color:#e07a5f; }
  .bar { display:none; height:8px; margin:9px 0 7px; background:var(--inputBg); border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .2s ease; }
  .bar.ind i { width:30%; animation:xmsIndet 1.2s linear infinite; }
  @keyframes xmsIndet { from { margin-left:-30%; } to { margin-left:100%; } }
  #cryptoModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; align-items:center; justify-content:center; }
  #cryptoModal.open { display:flex; }
  .cmBox { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; width:min(560px, 92vw); position:relative; }
  .cmBox h3 { margin:0 0 16px; }
  .cmRow { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .cmCoin { font-weight:700; width:96px; }
  .cmCoin small { color:var(--dim); font-weight:400; display:block; font-size:11px; }
  .cmAddr { flex:1; font-family:Consolas, monospace; font-size:11.5px; background:var(--inputBg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; word-break:break-all; min-width:200px; }
  .cmBtn { background:var(--inputBg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:12px; font-weight:600; text-decoration:none; cursor:pointer; }
  #cmClose { position:absolute; top:8px; right:12px; background:none; border:none; font-size:24px; color:var(--dim); }
  @media (max-width: 900px) {
    main { flex-direction: column; align-items: center; }
    #controls { width:100%; max-width:560px; }
    #preview { width:100%; }
    canvas { height:auto; max-height:none; width:100%; }
  }
  #compatPop { position:fixed; top:-140px; left:0; right:0; z-index:60; background:var(--warnBg); color:var(--warnText); border-bottom:1px solid var(--warnBorder); padding:14px 52px 14px 20px; font-size:13.5px; line-height:1.55; text-align:center; transition:top .4s ease; }
  #compatPop.show { top:0; }
  #compatPop .ok { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:var(--acc); color:var(--btnText); border:none; border-radius:6px; padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .foot { max-width:1180px; margin:8px auto 0; padding:22px 24px 30px; border-top:1px solid var(--line); }
  .footIn { max-width:720px; margin:0 auto; text-align:center; color:var(--dim); font-size:12.5px; line-height:1.6; }
  .footData { margin:0 0 10px; }
  .footLove { margin:0 0 8px; font-size:13px; color:var(--fg); }
  .footDisc { margin:0; font-size:11.5px; opacity:.75; }
  .footLove a { color:var(--acc); font-weight:600; text-decoration:none; }
  .footLove a:hover { text-decoration:underline; }
  .footLove .hh { color:#d05353; }
  .ideatop { max-width:720px; margin:12px auto 0; text-align:center; color:var(--dim); font-size:13.5px; line-height:1.55; }
  .ideatop p { margin:0 0 3px; }
</style>
</head>
<body>
<div id="compatPop" style="display:none">
  <span data-i18n="bnFw"></span> — <span data-i18n="rmTested"></span>
  <button class="ok" id="compatOk" data-i18n="okBtn"></button>
</div>
<header class="nav">
  <div class="navIn">
    <a class="brand" href="#">Xteink <span>Meteo</span> Sleep</a>
    <div class="navBadges">
      <button class="badge lang" data-lang="ru" data-i18n="langRu" title="Русский"></button>
      <button class="badge lang" data-lang="en" data-i18n="langEn" title="English"></button>
      <div class="dd" id="donateWrap">
        <button class="accHead" id="donateBtn"><span class="hh">♥</span> <span data-i18n="donate"></span> <span class="hh">♥</span></button>
        <div class="accBody">
          <button class="accItem" id="ddCrypto"><span><span data-i18n="crypto"></span><small>USDT / BTC / ETH</small></span></button>
          <a class="accItem" href="https://web.tribute.tg/d/Q5J" target="_blank" rel="noopener"><span><span>Tribute</span><small>Telegram</small></span></a>
        </div>
      </div>
      <a class="badge gh" href="https://github.com/aktogde1/xteink-meteo-sleep" target="_blank" rel="noopener" title="GitHub" style="gap:7px">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub <svg viewBox="0 0 16 16" width="13" height="13" fill="#f0c14b" aria-hidden="true"><path d="M8 .9l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4L3.5 14.7l.9-5L.8 6.2l5-.7L8 .9z"/></svg> <b class="cnt" id="ghCnt">–</b>
      </a>
    </div>
  </div>
</header>
<p style="text-align:center;color:var(--dim);margin:14px 0 0;font-size:14px" data-i18n="subtitle"></p>
<div class="ideatop">
  <p data-i18n="ideaP"></p>
  <p data-i18n="ideaNext"></p>
</div>

<main>
  <div id="controls">
    <div class="group">
      <label data-i18n="mode"></label>
      <div class="seg" id="modeSeg">
        <button data-mode="meteo" data-i18n="modeMeteo"></button>
        <button data-mode="card" data-i18n="modeCard"></button>
      </div>
    </div>

    <div id="meteoCtl">
    <div class="group">
      <label data-i18n="city"></label>
      <div class="inline">
        <input type="text" id="city" data-i18n-ph="cityPh">
        <button class="btn secondary" id="searchCity" data-i18n="find"></button>
      </div>
      <div id="geoResults"></div>
    </div>

    <div class="group">
      <label data-i18n="days"></label>
      <div class="seg small" id="daysSeg">
        <button data-days="2">2</button>
        <button data-days="3">3</button>
        <button data-days="4">4</button>
        <button data-days="5">5</button>
      </div>
    </div>
    </div>

    <div id="cardCtl" style="display:none">
    <div class="group">
      <label data-i18n="cardUrl"></label>
      <input type="text" id="cardUrl" data-i18n-ph="cardUrlPh" maxlength="600" inputmode="url">
      <span class="hint" data-i18n="cardUrlHint"></span>
    </div>
    </div>

    <div class="group">
      <label data-i18n="device"></label>
      <div class="seg" id="deviceSeg">
        <button data-dev="x4">X4</button>
        <button data-dev="x3">X3</button>
      </div>
    </div>


    <div class="group">
      <label data-i18n="theme"></label>
      <div class="seg" id="themeSeg">
        <button data-theme="dark" data-i18n="themeDark"></button>
      </div>
      <button class="btn wide secondary" id="refresh" data-i18n="refresh"></button>
      <button class="btn wide secondary" id="download" disabled data-i18n="download"></button>
      <div id="genStatus" class="status"></div>
    </div>

    <div class="group" id="instBlock">
      <label data-i18n="instBlock"></label>
      <div id="httpsNote" class="hint warn" style="display:none" data-i18n="httpsNote"></div>
      <input type="text" id="readerAddr" placeholder="192.168.137.69" autocomplete="off" inputmode="url">
      <span class="hint" data-i18n="readerHint"></span>
      <button class="btn wide" id="install" disabled data-i18n="install"></button>
      <div class="bar" id="prog"><i id="pfill"></i></div>
      <div id="status" class="status"></div>
    </div>

      </div>
  <div id="preview"><div id="frame"><canvas id="card" width="480" height="800"></canvas></div></div>
</main>

<footer class="foot">
  <div class="footIn">
    <p class="footData" data-i18n="footData"></p>
    <p class="footLove"><a href="https://github.com/aktogde1" target="_blank" rel="noopener">aktogde1</a> <span data-i18n="madeFor"></span> <span class="hh">♥</span></p>
    <p class="footDisc" data-i18n="disclaimer"></p>
  </div>
</footer>

<div id="cryptoModal">
  <div class="cmBox">
    <button id="cmClose" title="✕">×</button>
    <h3 data-i18n="cmTitle"></h3>
    <div id="cmRows"></div>
  </div>
</div>

function t(key){
  return (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
}
function tf(key, map){
  return t(key).replace(/\{(\w+)\}/g, (_, k) => map[k]);
}

// ---------- даты ----------
const fmtTemp = t => (t > 0 ? "+" : "") + Math.round(t) + "°";
const hhmm = iso => iso.slice(11, 16);
const two = x => String(x).padStart(2, "0");
function dateLong(d){ return new Intl.DateTimeFormat(LOCALE[LANG], { weekday: "long", day: "numeric", month: "long" }).format(d); }
function dayShort(d){ return new Intl.DateTimeFormat(LOCALE[LANG], { weekday: "short" }).format(d) + " " + d.getDate(); }

// ---------- фаза луны ----------
const SYNODIC = 29.530588853;
function moonPhase(date){
  const ref = Date.UTC(2000, 0, 6, 18, 14);
  const daysMs = (date.getTime() - ref) / 86400000;
  let p = (daysMs % SYNODIC) / SYNODIC;
  if (p < 0) p += 1;
  const illum = Math.round((1 - Math.cos(2 * Math.PI * p)) / 2 * 100);
  let idx;
  if (p < .03 || p > .97) idx = 0;
  else if (p < .22) idx = 1;
  else if (p < .28) idx = 2;
  else if (p < .47) idx = 3;
  else if (p < .53) idx = 4;
  else if (p < .72) idx = 5;
  else if (p < .78) idx = 6;
  else idx = 7;
  return { phase: p, illum, name: I18N[LANG].moon[idx] };
}

// ---------- погода: коды WMO ----------
function wmoKey(code){
  if (code === 0) return 0;
  if (code === 1) return 1;
  if (code === 2) return 2;
  if (code === 3) return 3;
  if (code <= 48) return 45;
  if (code <= 57) return 56;
  if (code === 61) return 61;
  if (code === 63) return 63;
  if (code === 65) return 65;
  if (code <= 67) return 66;
  if (code <= 72) return 71;
  if (code <= 74) return 73;
  if (code <= 76) return 75;
  if (code === 77) return 77;
  if (code <= 82) return 80;
  if (code <= 86) return 85;
  if (code === 95) return 95;
  return 96;
}
function wmoText(code){
  const d = I18N[LANG].wmo;
  const k = wmoKey(code);
  return d[k] !== undefined ? d[k] : d[80];
}
function wmoKind(code){
  if (code === 0) return "sun";
  if (code <= 2) return "partly";
  if (code === 3) return "cloud";
  if (code <= 48) return "fog";
  if (code <= 57) return "drizzle";
  if (code <= 67) return "rain";
  if (code <= 77) return "snow";
  if (code <= 82) return "rain";
  if (code <= 86) return "snow";
  return "thunder";
}

// ---------- QR-код: вшитая библиотека qrcode-generator (MIT), офлайн ----------
qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
const QR = {
  make(str){
    const q = qrcode(0, "H");
    q.addData(String(str), "Byte");
    q.make();
    const n = q.getModuleCount(), m = [];
    for (let r = 0; r < n; r++){
      const row = [];
      for (let c = 0; c < n; c++) row.push(q.isDark(r, c));
      m.push(row);
    }
    return m;
  }
};

// ---------- рисование ----------
let BG = "#ffffff", FG = "#000000";

function setFont(px, bold){ ctx.font = (bold ? "700 " : "400 ") + Math.round(px) + "px 'Segoe UI', Arial, sans-serif"; }
function text(str, x, y, px, bold, align){
  setFont(px, bold);
  ctx.textAlign = align || "left";
  ctx.fillStyle = FG;
  ctx.fillText(str, x, y);
}

function drawSun(cx, cy, r){
  ctx.strokeStyle = FG;
  ctx.lineWidth = Math.max(2, r * 0.11);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 8; i++){
    const a = Math.PI / 8 + i * Math.PI / 4;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r * 1.3, cy + Math.sin(a) * r * 1.3);
    ctx.lineTo(cx + Math.cos(a) * r * 1.62, cy + Math.sin(a) * r * 1.62);
    ctx.stroke();
  }
  ctx.fillStyle = FG;
}
function drawCloud(cx, cy, s){
  ctx.beginPath();
  ctx.arc(cx - 0.42 * s, cy + 0.12 * s, 0.27 * s, Math.PI * 0.45, Math.PI * 1.55);
  ctx.arc(cx - 0.02 * s, cy - 0.18 * s, 0.30 * s, Math.PI * 0.9, Math.PI * 1.95);
  ctx.arc(cx + 0.36 * s, cy + 0.02 * s, 0.24 * s, Math.PI * 1.25, Math.PI * 0.55);
  ctx.closePath();
  ctx.fillStyle = BG; ctx.fill();
  ctx.strokeStyle = FG; ctx.stroke();
  ctx.fillStyle = FG;
}
function drawIcon(kind, cx, cy, s){
  ctx.strokeStyle = FG; ctx.fillStyle = FG;
  ctx.lineWidth = Math.max(2, s * 0.055);
  const so = s * 0.34;
  if (kind === "sun") drawSun(cx, cy, s * 0.36);
  else if (kind === "moon") drawMoon(cx, cy, s * 0.36, moonPhase(new Date()).phase);
  else if (kind === "partly"){ drawSun(cx - s * 0.18, cy - s * 0.28, s * 0.24); drawCloud(cx + s * 0.08, cy + s * 0.14, s * 0.68); }
  else if (kind === "cloud") drawCloud(cx, cy, s * 0.8);
  else if (kind === "fog"){
    drawCloud(cx, cy - s * 0.14, s * 0.62);
    for (let i = 0; i < 3; i++){ ctx.beginPath(); ctx.moveTo(cx - s * 0.34, cy + s * 0.1 + i * s * 0.14); ctx.lineTo(cx + s * 0.34, cy + s * 0.1 + i * s * 0.14); ctx.stroke(); }
  }
  else if (kind === "drizzle" || kind === "rain"){
    drawCloud(cx, cy - s * 0.16, s * 0.66);
    const n = kind === "rain" ? 3 : 2, len = s * (kind === "rain" ? 0.2 : 0.12);
    for (let i = 0; i < n; i++){
      const x = cx + (i - (n - 1) / 2) * s * 0.22;
      ctx.beginPath(); ctx.moveTo(x, cy + s * 0.1); ctx.lineTo(x - s * 0.07, cy + s * 0.1 + len); ctx.stroke();
    }
  }
  else if (kind === "snow"){
    drawCloud(cx, cy - s * 0.16, s * 0.66);
    for (let i = 0; i < 3; i++){
      const x = cx + (i - 1) * s * 0.22, y = cy + s * 0.16, rr = s * 0.055;
      for (let a = 0; a < 3; a++){
        const an = a * Math.PI / 3;
        ctx.beginPath(); ctx.moveTo(x - Math.cos(an) * rr, y - Math.sin(an) * rr); ctx.lineTo(x + Math.cos(an) * rr, y + Math.sin(an) * rr); ctx.stroke();
      }
    }
  }
  else if (kind === "thunder"){
    drawCloud(cx, cy - s * 0.18, s * 0.62);
    ctx.beginPath();
    ctx.moveTo(cx + s * 0.05, cy + s * 0.04);
    ctx.lineTo(cx - s * 0.08, cy + s * 0.22);
    ctx.lineTo(cx + s * 0.01, cy + s * 0.22);
    ctx.lineTo(cx - s * 0.06, cy + s * 0.42);
    ctx.lineTo(cx + s * 0.12, cy + s * 0.16);
    ctx.lineTo(cx + s * 0.02, cy + s * 0.16);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = FG; ctx.strokeStyle = FG;
}

function drawMoon(cx, cy, r, phase){
  const k = Math.cos(2 * Math.PI * phase);
  const waxing = phase <= 0.5;
  const s = waxing ? 1 : -1;
  const a = Math.abs(k) * r;
  const insideTerm = (dx, dy) => a > 0 && (dx * dx) / (a * a) + (dy * dy) / (r * r) <= 1;
  ctx.fillStyle = FG;
  for (let dy = -r; dy <= r; dy++){
    for (let dx = -r; dx <= r; dx++){
      if (dx * dx + dy * dy > r * r) continue;
      let dark;
      if (Math.abs(k) < 0.02) dark = false;
      else if (Math.abs(k) > 0.98) dark = true;
      else if (k > 0) dark = (s * dx <= 0) || insideTerm(dx, dy);
      else dark = (s * dx < 0) && !insideTerm(dx, dy);
      if (dark) ctx.fillRect(cx + dx, cy + dy, 1, 1);
    }
  }
  ctx.strokeStyle = FG;
  ctx.lineWidth = Math.max(2, r * 0.07);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = FG;
}

// ---------- карточка ----------
function drawCard(dayOffset){
  dayOffset = dayOffset || 0;
  const w = canvas.width, h = canvas.height;
  const inv = theme === "dark";
  BG = inv ? "#000000" : "#ffffff";
  FG = inv ? "#ffffff" : "#000000";
  ctx.fillStyle = BG; ctx.fillRect(0, 0, w, h);
  ctx.textBaseline = "alphabetic";

  const pad = Math.round(w * 0.058);
  const now = new Date();
  const cardDate = new Date(now.getTime() + dayOffset * 86400000);
  const moon = moonPhase(cardDate);
  const d0 = weather ? weather.daily : null;
  const cur = weather ? weather.current : null;

  let y;
  if (W.date){
    text(dateLong(cardDate), w / 2, pad + w * 0.062, w * 0.062, true, "center");
    y = pad + w * 0.062 + Math.max(h * 0.033, w * 0.095);
  } else {
    y = pad + Math.max(h * 0.033, w * 0.06);
  }

  if (weather){
    let drew = false;
    const footH = h * 0.062;

    if (W.cur){
      drew = true;
      const iconS = w * 0.32;
      let tempSize = w * 0.28;
      const tempStr = fmtTemp(cur.temperature_2m);
      const maxTempW = w - pad * 2 - iconS - w * 0.06;
      setFont(tempSize, true);
      while (tempSize > w * 0.12 && ctx.measureText(tempStr).width > maxTempW){
        tempSize -= 2;
        setFont(tempSize, true);
      }
      ctx.textAlign = "left";
      ctx.fillStyle = FG;
      ctx.fillText(tempStr, pad, y + tempSize * 0.8);
      drawIcon(wmoKind(cur.weather_code), w - pad - iconS / 2, y + iconS * 0.48, iconS);
      y += Math.max(tempSize * 0.8, iconS * 0.96) + w * 0.085;

      text(wmoText(cur.weather_code), pad, y, w * 0.072, true);
      y += w * 0.072 + h * 0.014;
    }
    if (W.dn){
      text(t("dayLbl") + " " + fmtTemp(d0.temperature_2m_max[dayOffset]) + "   ·   " + t("nightLbl") + " " + fmtTemp(d0.temperature_2m_min[dayOffset]), pad, y, w * 0.056, false);
      y += h * 0.045;
      drew = true;
    }
    if (W.sm){
      const labelPx = w * 0.048, timePx = w * 0.06;
      const col2 = w * 0.55;
      drawIcon("sun", pad + w * 0.032, y - timePx * 0.28, w * 0.064);
      text(t("sunrise") + " ", pad + w * 0.075, y, labelPx, false);
      const w1 = ctx.measureText(t("sunrise") + " ").width;
      text(hhmm(d0.sunrise[dayOffset]), pad + w * 0.075 + w1, y, timePx, true);
      drawIcon("moon", col2 + w * 0.032, y - timePx * 0.28, w * 0.064);
      text(t("sunset") + " ", col2 + w * 0.075, y, labelPx, false);
      const w2 = ctx.measureText(t("sunset") + " ").width;
      text(hhmm(d0.sunset[dayOffset]), col2 + w * 0.075 + w2, y, timePx, true);
      y += h * 0.042;
      drew = true;
    }
    {
      const mr = w * 0.026;
      drawMoon(pad + mr, y - w * 0.017, mr, moon.phase);
      text(moon.name + "  ·  " + moon.illum + "%", pad + mr * 2 + w * 0.022, y, w * 0.048, false);
      y += h * 0.042;
      drew = true;
    }
    if (W.fc){
      if (drew){
        ctx.strokeStyle = FG;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - pad, y); ctx.stroke();
        y += h * 0.026;
      }
      const n = Math.min(days, weather.daily.time.length - 1 - dayOffset);
      const rowH = Math.max(34, Math.min(w * 0.14, (h - footH - y) / Math.max(1, n)));
      const txtPx = Math.min(w * 0.054, rowH * 0.52);
      for (let i = dayOffset + 1; i <= dayOffset + n; i++){
        const d = new Date(weather.daily.time[i] + "T12:00:00");
        const cy2 = y + rowH / 2;
        text(dayShort(d), pad, cy2 + txtPx * 0.36, txtPx, true);
        drawIcon(wmoKind(weather.daily.weather_code[i]), w * 0.40, cy2, rowH * 0.62);
        text(t("dS") + " " + fmtTemp(weather.daily.temperature_2m_max[i]) + " · " + t("nS") + " " + fmtTemp(weather.daily.temperature_2m_min[i]), w - pad, cy2 + txtPx * 0.36, txtPx, false, "right");
        y += rowH;
      }
      drew = true;
    }
    if (W.city){
      const fpx = w * 0.04;
      text(place ? place.name : "", pad, h - footH * 0.3, fpx, false);
      text(t("updated") + " " + two(now.getHours()) + ":" + two(now.getMinutes()), w - pad, h - footH * 0.3, fpx, false, "right");
    }
  } else {
    text(t("noData"), w / 2, y + h * 0.1, w * 0.07, false, "center");
  }
}

// ---------- визитка ----------
function drawQr(m, x, y, size){
  const n = m.length, total = n + 8; // 4 модуля тихой зоны с каждой стороны
  const s = Math.max(2, Math.floor(size / total));
  const side = s * total;
  const ox = Math.round(x + (size - side) / 2), oy = Math.round(y + (size - side) / 2);
  // QR всегда чёрным на белой «плашке» — на тёмной карточке инвертированный код не сканируется
  ctx.fillStyle = "#ffffff"; ctx.fillRect(ox, oy, side, side);
  ctx.fillStyle = "#000000";
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++)
      if (m[r][c]) ctx.fillRect(ox + (c + 4) * s, oy + (r + 4) * s, s, s);
  ctx.fillStyle = FG;
}

  }
}

// ---------- BMP ----------
function encodeBMP(){
  const w = canvas.width, h = canvas.height;
  const img = ctx.getImageData(0, 0, w, h).data;
  const rowSize = Math.floor((24 * w + 31) / 32) * 4;
  const dataSize = rowSize * h, fileSize = 54 + dataSize;
  const buf = new ArrayBuffer(fileSize), dv = new DataView(buf);
  dv.setUint8(0, 0x42); dv.setUint8(1, 0x4D);
  dv.setUint32(2, fileSize, true);
  dv.setUint32(10, 54, true);
  dv.setUint32(14, 40, true);
  dv.setInt32(18, w, true);
  dv.setInt32(22, h, true);
  dv.setUint16(26, 1, true);
  dv.setUint16(28, 24, true);
  dv.setUint32(34, dataSize, true);
  for (let y = 0; y < h; y++){
    let off = 54 + (h - 1 - y) * rowSize;
    for (let x = 0; x < w; x++){
      const i = (y * w + x) * 4;
      const lum = 0.299 * img[i] + 0.587 * img[i + 1] + 0.114 * img[i + 2];
      const v = lum < 140 ? 0 : 255;
      dv.setUint8(off, v); dv.setUint8(off + 1, v); dv.setUint8(off + 2, v);
      off += 3;
    }
  }
  return new Blob([buf], { type: "image/bmp" });
}

async function searchCity(){
  const q = $("city").value.trim();
  if (!q) return;
  $("geoResults").innerHTML = "";
  setStatusG(t("stSearching"));
  let list = null;
  // 1) Open-Meteo geocoder
  try {
    for (const lg of [LANG, "", "en"]){
      const u = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(q) + "&count=8&format=json" + (lg ? "&language=" + lg : "");
      const r = await fetch(u);
      const j = await r.json();
      if (j.results && j.results.length){
        list = j.results.map(res => ({ name: res.name, sub: [res.admin1, res.country].filter(Boolean).join(", "), lat: res.latitude, lon: res.longitude }));
        break;
      }
    }
  } catch(e){ /* переходим к Nominatim */ }
  // 2) фолбэк: Nominatim (OpenStreetMap), если Open-Meteo недоступен
  if (!list){
    try {
      const u = "https://nominatim.openstreetmap.org/search?q=" + encodeURIComponent(q) + "&format=jsonv2&addressdetails=1&limit=8&accept-language=" + (LOCALE[LANG] || "en");
      const r = await fetch(u);
      const j = await r.json();
      if (Array.isArray(j) && j.length){
        list = j.map(res => {
          const parts = String(res.display_name || "").split(", ");
          return { name: res.name || parts[0], sub: parts.slice(1).join(", "), lat: parseFloat(res.lat), lon: parseFloat(res.lon) };
        });
      }
    } catch(e){}
  }
  if (!list || !list.length){ setStatusG(t("stNotFound"), "err"); return; }
  setStatusG(tf("stFound", { n: list.length }));
  for (const res of list){
    const div = document.createElement("div");
    div.className = "geoItem";
    const b = document.createElement("b"); b.textContent = res.name;
    const sm = document.createElement("small"); sm.textContent = res.sub;
    div.appendChild(b); div.appendChild(sm);
    div.onclick = () => {
      $("geoResults").innerHTML = "";
      place = { name: res.name, lat: res.lat, lon: res.lon };
      storeSet("city", place);
      loadWeather();
    };
    $("geoResults").appendChild(div);
  }
}

async function loadWeather(){
  const my = (window._lw = (window._lw || 0) + 1); // устаревший ответ игнорируем
  if (!place) return;
  setStatusG(tf("stLoading", { city: place.name }));
  const n = 1 + days;
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + place.lat + "&longitude=" + place.lon +
    "&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset" +
    "&timezone=auto&forecast_days=" + Math.max(n, 6);
  for (let attempt = 0; attempt < 2; attempt++){
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      if (my !== window._lw) return;
      weather = j;
      redraw();
      $("download").disabled = false;
      $("install").disabled = false;
      setStatusG(tf("stReady", { w: canvas.width, h: canvas.height }), "ok");
      return;
    } catch(e){
      if (my !== window._lw) return;
      if (attempt === 0){ await new Promise(res => setTimeout(res, 1500)); setStatusG("…повтор"); }
    }
  }
  setStatusG(t("stWeatherFail"), "err");
}

// ---------- интерфейс ----------
function currentSize(){ return DEVICES[device]; }
function redraw(){
  if (mode === "card") drawVisit();
  else if (weather) drawCard();
  else { ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
}
function applyMode(){
  for (const b of $("modeSeg").children) b.classList.toggle("active", b.dataset.mode === mode);
  $("meteoCtl").style.display = mode === "meteo" ? "" : "none";
  $("cardCtl").style.display = mode === "card" ? "" : "none";
  $("refresh").style.display = mode === "meteo" ? "" : "none";
  $("download").disabled = mode === "meteo" && !weather;
  $("install").disabled = location.protocol === "https:" || (mode === "meteo" && !weather);
  storeStr("mode", mode === "card" ? "card" : "");
  redraw();
}
function applyDevice(){
  for (const b of $("deviceSeg").children) b.classList.toggle("active", b.dataset.dev === device);
  const size = currentSize();
  canvas.width = size[0]; canvas.height = size[1];
  redraw();
  storeStr("device", device);
}
function applyDaysActive(){
  for (const b of $("daysSeg").children) b.classList.toggle("active", parseInt(b.dataset.days, 10) === days);
}
function applyLangActive(){
  for (const b of document.querySelectorAll(".badge.lang")) b.classList.toggle("active", b.dataset.lang === LANG);
}
function applyI18n(){
  document.documentElement.lang = LOCALE[LANG].split("-")[0];
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $("donateWrap").style.display = (DONATE_URL || CRYPTO.length) ? "" : "none";
  applyLangActive();
}
async function refreshPlaceName(){
  if (!place) return;
  try {
    // Nominatim (OpenStreetMap): отдаёт название города на нужном языке по координатам
    const r = await fetch("https://nominatim.openstreetmap.org/reverse?lat=" + place.lat + "&lon=" + place.lon + "&format=jsonv2&zoom=10&accept-language=" + LOCALE[LANG]);
    const j = await r.json();
    const a = j.address || {};
    const name = a.city || a.town || a.village || a.municipality || a.county;
    if (name){
      place.name = name;
      storeSet("city", place);
      $("city").value = place.name;
    }
  } catch(e){ /* оставляем прежнее имя */ }
}
document.querySelectorAll(".badge.lang").forEach(b => b.onclick = async () => {
  if (LANG === b.dataset.lang) return;
  LANG = b.dataset.lang;
  storeStr("lang", LANG);
  await refreshPlaceName();
  applyI18n();
  redraw();
});
$("deviceSeg").onclick = e => {
  const b = e.target.closest("button[data-dev]");
  if (!b) return;
  device = b.dataset.dev;
  applyDevice();
  if (place) loadWeather();
};
$("daysSeg").onclick = e => {
  const b = e.target.closest("button[data-days]");
  if (!b) return;
  days = parseInt(b.dataset.days, 10);
  applyDaysActive();
  storeStr("days", String(days));
  if (place) loadWeather();
};
$("modeSeg").onclick = e => {
  const b = e.target.closest("button[data-mode]");
  if (!b) return;
  mode = b.dataset.mode;
  applyMode();
};
const CARD_FIELDS = ["cardUrl"];
function saveCard(){
  const o = {};
  for (const k of CARD_FIELDS) o[k] = $(k).value;
  storeSet("visitCard", o);
}
for (const k of CARD_FIELDS){
  $(k).addEventListener("input", () => {
    saveCard();
    if (mode === "card") redraw();
  });
}
$("themeSeg").onclick = e => {
  const b = e.target.closest("button[data-theme]");
  if (!b) return;
  theme = theme === "dark" ? "light" : "dark";
  applyThemeActive();
  storeStr("invert", theme === "dark" ? "1" : "");

function applyThemeActive(){
  $("themeSeg").querySelector("button[data-theme=dark]").classList.toggle("active", theme === "dark");
}
$("searchCity").onclick = searchCity;
$("city").addEventListener("keydown", e => { if (e.key === "Enter") searchCity(); });
$("refresh").onclick = () => place ? loadWeather() : searchCity();
$("download").onclick = () => {
  redraw();
  const blob = encodeBMP();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sleep.bmp";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

// ---------- установка на ридер ----------
function readerAddress(){
  const a = $("readerAddr").value.trim().replace(/\/+$/, "");
  if (!a) return "";
  storeStr("reader", a);
  return /^https?:\/\//.test(a) ? a : "http://" + a;
}

// ---------- релей (локальный сервер) ----------
let RELAY = false;
fetch("/relay-check").then(r => { RELAY = r.ok; }).catch(() => {});
function relaySend(blob, addr, folder, filename, onPct){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    const url = "/relay?addr=" + encodeURIComponent(addr + "/upload?path=" + encodeURIComponent(folder)) + "&name=" + encodeURIComponent(filename);
    xhr.open("POST", url);
    if (xhr.upload) xhr.upload.onprogress = e => { if (e.lengthComputable && onPct) onPct(e.loaded / e.total); };
    xhr.onload = () => {
      const resp = xhr.responseText || "";
      if (resp.indexOf("ERR") === 0) reject(new Error(resp));
      else resolve();
    };
    xhr.onerror = () => reject(new Error("relay"));
    xhr.send(blob);
  });
}
// слепая отправка напрямую (когда релея нет)
function directSend(blob, addr, folder, filename){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", addr + "/upload?path=" + encodeURIComponent(folder));
    xhr.onload = () => resolve();
    xhr.onerror = () => resolve(); // ответ скрыт CORS, но запрос уходит
    const fd = new FormData();
    fd.append("file", new File([blob], filename, { type: "image/bmp" }));
    xhr.send(fd);
  });
}
async function sendOne(addr, folder, filename, blob, onPct){
  if (RELAY) return relaySend(blob, addr, folder, filename, onPct);
  return directSend(blob, addr, folder, filename);
}

async function installOnReader(){
  if (mode === "meteo" && !weather){ setStatus(t("stNoWeather"), "err"); return; }
  const addr = readerAddress();
  if (!addr){ setStatus(t("stNoAddr"), "err"); return; }
  if (!RELAY){
    try { await fetch(addr, { mode: "no-cors" }); } // достижимость: сеть не путаем с CORS
    catch(e){ setStatus(t("stSendErr"), "err"); return; }
  }
  let folder = "/Sleep";
  setStatus(tf("stLoading", { city: addr }));
  redraw();
  const blob = encodeBMP();
  const bar = $("prog"), fill = $("pfill");
  bar.style.display = "block";
  bar.classList.toggle("ind", !RELAY);
  fill.style.width = RELAY ? "0%" : "";
  try {
    await sendOne(addr, folder, "sleep.bmp", blob, p => { if (RELAY) fill.style.width = Math.round(p * 100) + "%"; });
    if (RELAY) fill.style.width = "100%";
  } catch(e){
    bar.style.display = "none";
    setStatus(t("stSendErr"), "err");
    return;
  }
  setStatus(t("stApplying"));
  try { await fetch(addr + "/api/settings", { mode: "no-cors", method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ sleepScreen: 3 }) }); } catch(e){}
  bar.style.display = "none";
  setStatus(t("stDone"), "ok");
}

$("install").onclick = installOnReader;

const CRYPTO = [
  { coin: "USDT", net: "TRC20 / TRON", addr: "TXkyArvXBQyFqSMcfK7pFeeaCyaYgenUg1", qr: "https://qr.crypt.bot/?url=TXkyArvXBQyFqSMcfK7pFeeaCyaYgenUg1" },
  { coin: "BTC", net: "Bitcoin", addr: "bc1qyp7rcyasjk6k0eh84qc8wvveaptyqnkmmt33p6", qr: "https://qr.crypt.bot/?url=bc1qyp7rcyasjk6k0eh84qc8wvveaptyqnkmmt33p6" },
  { coin: "ETH", net: "Ethereum", addr: "0x68ba5c4b009579525fac3318AcD4Ec00938C5Ca4", qr: "https://qr.crypt.bot/?url=0x68ba5c4b009579525fac3318AcD4Ec00938C5Ca4" }
];
const COPY_ICON = String.fromCodePoint(0x1F4CC);
const COPIED_ICON = "✓".normalize();
function buildCryptoRows(){
  const rows = $("cmRows"); rows.innerHTML = "";
  for (const c of CRYPTO){
    const row = document.createElement("div"); row.className = "cmRow";
    const coin = document.createElement("div"); coin.className = "cmCoin";
    coin.innerHTML = c.coin + "<small>" + c.net + "</small>";
    const addr = document.createElement("div"); addr.className = "cmAddr"; addr.textContent = c.addr;
    const copy = document.createElement("button"); copy.className = "cmBtn"; copy.textContent = COPY_ICON;
    copy.onclick = () => {
      const done = () => { copy.textContent = COPIED_ICON + " " + t("copied"); setTimeout(() => { copy.textContent = COPY_ICON; }, 1600); };
      const fallback = () => { prompt(t("copied"), c.addr); done(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c.addr).then(done, fallback);
      else fallback();
    };
    const qr = document.createElement("a"); qr.className = "cmBtn"; qr.href = c.qr; qr.target = "_blank"; qr.rel = "noopener"; qr.textContent = "QR ↗";
    row.append(coin, addr, copy, qr);
    rows.appendChild(row);
  }
}
$("donateBtn").onclick = e => {
  e.stopPropagation();
  $("donateWrap").classList.toggle("open");
};
$("ddCrypto").onclick = () => {
  $("donateWrap").classList.remove("open");
  buildCryptoRows();
  $("cryptoModal").classList.add("open");
};

});
$("cmClose").onclick = () => $("cryptoModal").classList.remove("open");
$("cryptoModal").onclick = e => { if (e.target.id === "cryptoModal") $("cryptoModal").classList.remove("open"); };

// ---------- старт ----------
(function init(){
  const urlLang = new URLSearchParams(location.search).get("lang");
  const savedLang = storeRaw("lang");
  const navLang = (navigator.language || "en").toLowerCase().split("-")[0];
  LANG = (urlLang && I18N[urlLang]) ? urlLang : (savedLang && I18N[savedLang] ? savedLang : (navLang === "ru" ? "ru" : "en"));
  const savedCity = storeGet("city");
  if (savedCity){ place = savedCity; $("city").value = savedCity.name; }
  else if (LANG === "ru"){ place = { name: "Санкт-Петербург", lat: 59.9391, lon: 30.3159 }; $("city").value = "Санкт-Петербург"; }
  const d = storeRaw("device");
  device = DEVICES[d] ? d : "x4";
  const savedReader = (storeRaw("reader") || "").replace(/^https?:\/\//, "");
  if (savedReader) $("readerAddr").value = savedReader;
  const legacyDays = parseInt(storeRaw("days"), 10);
  if (legacyDays >= 2 && legacyDays <= 5) days = legacyDays;
  theme = storeRaw("invert") ? "dark" : "light";
  mode = storeRaw("mode") === "card" ? "card" : "meteo";
  const savedCard = storeGet("visitCard");
  if (savedCard) for (const k of CARD_FIELDS) if (typeof savedCard[k] === "string") $(k).value = savedCard[k];
  applyThemeActive();
  if (location.protocol === "https:"){
    $("httpsNote").style.display = "block";
    $("instBlock").classList.add("off");
  }
  applyI18n();
  applyDevice();
  applyDaysActive();
  applyMode();
  if (place) loadWeather();
  if (!localStorage.getItem("lsx.compatSeen")){
    const cp = document.getElementById("compatPop");
    cp.style.display = "block";
    requestAnimationFrame(() => requestAnimationFrame(() => cp.classList.add("show")));
    document.getElementById("compatOk").onclick = () => {
      cp.classList.remove("show");
      localStorage.setItem("lsx.compatSeen", "1");
      setTimeout(() => { cp.style.display = "none"; }, 450);
    };
  }
})();
